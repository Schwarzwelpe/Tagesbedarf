<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagesplanung</title>
<meta name="description" content="Tagesplanung: Ruheenergie plus Aktivität plus Surplus, abzüglich geplantem Essen, pro Wochentag (Mo bis So).">
<meta name="theme-color" content="#f1f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e181e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tagesplanung">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>if (window.navigator.standalone) document.documentElement.classList.add("standalone");</script>
<style>
:root {
  /* Layout: eine Spalte, alle Zeilen kompakt, Wochentag Umschalter (Mo bis So) als feste Leiste unten */
  --bg: #f1f5fa;
  --surface: #ffffff;
  --ink: #1b2a33;
  --muted: #5d6f7b;
  --input-row: #eaf2ff;
  --input-ink: #1f4fd8;
  --calc-row: #e4f0ec;
  --total-bg: #17414a;
  --total-ink: #ffffff;
  --rest-bg: #e4f0ec;
  --rest-ink: #0d6b4f;
  --line: #d3dfe9;
  --focus: #1f4fd8;
  --danger: #b3261e;
  --danger-bg: #fdeceb;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --row-h: clamp(34px, 4.9dvh, 44px);
  --big-h: clamp(54px, 8dvh, 68px);
  --bar-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e181e;
    --surface: #15242c;
    --ink: #e6eef2;
    --muted: #93a6b2;
    --input-row: #172a3d;
    --input-ink: #86adff;
    --calc-row: #17302a;
    --total-bg: #1f5a66;
    --total-ink: #ffffff;
    --rest-bg: #17302a;
    --rest-ink: #6fe0b4;
    --line: #2a3d48;
    --focus: #86adff;
    --danger: #ff8a80;
    --danger-bg: #3a1c1a;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-variant-numeric: tabular-nums;
  padding:
    max(10px, calc(env(safe-area-inset-top) * 1.4))
    max(14px, env(safe-area-inset-right))
    calc(var(--bar-h) + env(safe-area-inset-bottom) + 14px)
    max(14px, env(safe-area-inset-left));
}
/* Home Bildschirm Modus: iOS meldet dort keinen oberen Sicherheitsabstand, der Titel läge im Unschärfebereich der Statusleiste */
@media (display-mode: standalone) {
  body { padding-top: max(48px, calc(env(safe-area-inset-top) * 1.4)); }
}
html.standalone body { padding-top: max(48px, calc(env(safe-area-inset-top) * 1.4)); }

main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 0 4px; }
header h1 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.015em; }
.head-right { display: flex; align-items: center; gap: 10px; }
.ver { color: var(--muted); font-size: 0.72rem; }
button.ver {
  font: 500 0.72rem var(--font); color: var(--muted); background: transparent; border: 0; border-radius: 8px;
  padding: 6px 2px; min-height: 32px; display: inline-flex; align-items: center; gap: 5px;
}
button.ver:active { background: color-mix(in srgb, var(--muted) 16%, transparent); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); }
.dot.s-ok { background: var(--rest-ink); }
.dot.s-wait, .dot.s-offline { background: #d98a00; }
.dot.s-denied { background: var(--danger); }
@media (prefers-color-scheme: dark) { .dot.s-wait, .dot.s-offline { background: #f0b840; } }
.sync .label { font-size: 0.92rem; line-height: 1.3; padding: 6px 0; }
.syncbox { display: grid; gap: 8px; padding: 4px 14px 12px; }
.syncbox[hidden], .synclink[hidden], .sync[hidden] { display: none; }
.syncbox input {
  width: 100%; height: 42px; padding: 0 12px; font: 600 1rem var(--font); color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
}
.syncbox input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
.syncbox button { min-height: 42px; border-radius: 12px; }
.synclink { padding: 0 14px 8px; text-align: right; }
button.linkbtn {
  font: 500 0.72rem var(--font); color: var(--muted); background: transparent; border: 0; border-radius: 6px;
  padding: 4px 2px; min-height: 28px; text-decoration: underline;
}
button.linkbtn:active { background: transparent; }
button.linkbtn.armed { color: var(--danger); }
.navlink {
  font: 700 0.8rem var(--font); color: var(--input-ink); text-decoration: none;
  border: 1.5px solid var(--input-ink); border-radius: 999px; padding: 3px 11px;
}
.navlink:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pill {
  background: var(--total-bg); color: var(--total-ink);
  font-size: 0.8rem; font-weight: 800; border-radius: 999px; padding: 4px 12px;
}

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--row-h); padding: 2px 16px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row.input { background: var(--input-row); }
.row.calc { background: var(--calc-row); font-weight: 700; }
.row .label { font-size: 1.02rem; }
.row .value { display: flex; align-items: baseline; gap: 6px; }
.unit { color: var(--muted); font-size: 0.75rem; font-weight: 600; }

.row input {
  width: 6.5ch; min-width: 0; height: 34px; text-align: right;
  font: 800 1.3rem/1 var(--font); font-variant-numeric: tabular-nums;
  color: var(--input-ink); background: transparent;
  border: 0; border-radius: 8px; padding: 0 2px;
  touch-action: manipulation;
  -moz-appearance: textfield; appearance: textfield;
}
.row input::-webkit-outer-spin-button,
.row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.row input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; background: color-mix(in srgb, var(--input-ink) 8%, transparent); }
.row.calc .num { font-size: 1.3rem; font-weight: 800; }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 6px 14px 8px; background: var(--input-row); border-bottom: 1px solid var(--line); }

button {
  font: 700 0.95rem var(--font); cursor: pointer; touch-action: manipulation;
  border-radius: 10px; border: 1.5px solid var(--input-ink); color: var(--input-ink);
  background: transparent; padding: 0 10px; min-height: 36px;
}
button:active { background: color-mix(in srgb, var(--input-ink) 16%, transparent); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }

.big {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--big-h); padding: 6px 16px;
}
.big .label { font-size: 1.35rem; font-weight: 800; }
.big .num { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.015em; }
.big .value { display: flex; align-items: baseline; gap: 8px; }
.total { background: var(--total-bg); color: var(--total-ink); }
.total .unit { color: color-mix(in srgb, var(--total-ink) 72%, transparent); }
.rest { background: var(--rest-bg); color: var(--rest-ink); border-top: 1px solid var(--line); }
.rest .unit { color: inherit; opacity: 0.8; }
.rest.over { background: var(--danger-bg); color: var(--danger); }

/* Hero: Essen geplant und Aktivität Ist oben und beim Scrollen sichtbar; Gesamt und Rest stehen unten in denselben Spalten */
.hero { position: sticky; top: 0; z-index: 4; display: grid; gap: 8px; background: var(--bg); padding: 2px 0 6px; }
@media (display-mode: standalone) { .hero { top: 44px; } }
html.standalone .hero { top: 44px; }
.hin2 { display: grid; grid-template-columns: 1.45fr 1fr; gap: 8px; }
.hcard { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 84px; padding: 8px 14px; background: var(--input-row); border: 1.5px solid var(--line); border-radius: 14px; }
.hcard:focus-within { border-color: var(--focus); }
.hcard .hl { font-size: 0.78rem; font-weight: 700; color: var(--muted); letter-spacing: 0.01em; }
.hcard .hv { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.hcard input {
  width: 100%; min-width: 0; height: 46px; text-align: left; padding: 0; border: 0; background: transparent; border-radius: 8px;
  font: 800 2.3rem/1 var(--font); font-variant-numeric: tabular-nums; color: var(--input-ink); letter-spacing: -0.02em;
  touch-action: manipulation; -moz-appearance: textfield; appearance: textfield;
}
.hcard.ist input { font-size: 1.7rem; }
.hcard input::placeholder { color: var(--muted); opacity: 0.55; font-weight: 700; }
.hcard input::-webkit-outer-spin-button, .hcard input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hcard input:focus-visible { outline: none; }
.hcard.ist.on { background: var(--total-bg); border-color: var(--total-bg); }
.hcard.ist.on .hl, .hcard.ist.on .unit { color: color-mix(in srgb, var(--total-ink) 78%, transparent); }
.hcard.ist.on input { color: var(--total-ink); }
.tiles { display: grid; grid-template-columns: 1.45fr 1fr; gap: 8px; }   /* gleiche Spalten wie die Karten oben (.hin2) */
.tile { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 84px; padding: 8px 14px; border: 1.5px solid transparent; border-radius: 14px; }
.tile.rest { border-top: 0; }
.tile .tl { font-size: 0.78rem; font-weight: 700; opacity: 0.85; }
.hin2 > *, .tiles > * { min-width: 0; }
.tile .tv { display: flex; align-items: baseline; gap: 6px; }
.tile .num { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.tile.total .unit { color: color-mix(in srgb, var(--total-ink) 72%, transparent); }
.tile.rest .unit { color: inherit; opacity: 0.8; }
@media (max-width: 340px) { .tile, .hcard { padding-left: 10px; padding-right: 10px; } .tile .num { font-size: 1.6rem; } .hcard input { font-size: 1.9rem; } .hcard.ist input { font-size: 1.4rem; } }
/* Training 1 bis 3: oben klein die Nummer, darunter die Auswahl des Trainingstyps (setzt den Standardwert, der Wert bleibt änderbar) */
.trow .tlab { display: flex; flex-direction: column; min-width: 0; flex: 1; padding: 2px 0; }
.trow .tn { font-size: 0.7rem; font-weight: 600; color: var(--muted); line-height: 1.15; }
.tsw { position: relative; display: inline-block; max-width: 100%; align-self: flex-start; }
.tsw::after { content: "▾"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: var(--input-ink); pointer-events: none; }
.tsel {
  -webkit-appearance: none; appearance: none; max-width: 100%; min-height: 28px; padding: 2px 22px 2px 0; margin: 0;
  background: transparent; border: 0; border-radius: 8px; color: var(--ink); font: 700 1.02rem var(--font);
  text-overflow: ellipsis; touch-action: manipulation; cursor: pointer;
}
.tsel.none { color: var(--muted); font-weight: 600; }
.tsel:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.row.input.off .value input { opacity: 0.35; }
.row.input.off .label { color: var(--muted); }
.mode { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; background: var(--line); color: var(--ink); vertical-align: 2px; }
.mode.ist { background: var(--total-bg); color: var(--total-ink); }
.row.derived { font-weight: 600; }
.row.derived[hidden] { display: none; }
.row small { display: block; font-size: 0.7rem; font-weight: 500; color: var(--muted); line-height: 1.2; }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions button { min-height: 44px; border-radius: 12px; }
.actions .copy { background: var(--total-bg); border-color: var(--total-bg); color: var(--total-ink); }
.actions .copy:active { background: color-mix(in srgb, var(--total-bg) 82%, black); }
.actions .reset { border-color: var(--line); color: var(--muted); background: var(--surface); }
.actions .reset.armed { border-color: var(--danger); color: var(--danger); }
.resetnote { padding: 0 6px; font-size: 0.72rem; line-height: 1.45; color: var(--muted); }
.resetnote[hidden] { display: none; }


.slots {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
.slots .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.slots button {
  min-height: 44px; border-radius: 12px; font-size: 0.92rem; padding: 0; position: relative;
  border-color: var(--line); color: var(--muted); background: transparent;
}
.slots button.today::after {
  content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px;
  border-radius: 50%; background: currentColor;
}
.slots button[aria-pressed="true"] { background: var(--total-bg); border-color: var(--total-bg); color: var(--total-ink); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tagesplanung</h1>
    <span class="head-right"><button type="button" class="ver" id="sync-toggle" aria-label="Sync Status und Zugang" aria-expanded="false">v1.9.2<i class="dot s-off" id="sync-dot"></i></button><a class="navlink" href="bilanz.html">Bilanz</a><span class="pill" id="slot-pill">Slot 1</span></span>
  </header>

  <section class="sheet sync" id="sync-panel" aria-label="Sync zwischen den Geräten" hidden>
    <div class="row"><span class="label" id="sync-text">Sync aus</span></div>
    <div class="syncbox" id="sync-setup">
      <input id="sync-pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passwort für den Sync">
      <button type="button" id="sync-save">Speichern und abgleichen</button>
    </div>
    <div class="synclink" id="sync-actions" hidden><button type="button" class="linkbtn" id="sync-out">Zugang zurücksetzen</button></div>
  </section>

  <section class="hero" aria-label="Essen geplant und Aktivität Ist">
    <div class="hin2">
      <label class="hcard essen" for="essen">
        <span class="hl">Essen geplant</span>
        <span class="hv"><input id="essen" data-key="essen" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
      </label>
      <label class="hcard ist" id="ist-card" for="ist">
        <span class="hl">Aktivität Ist</span>
        <span class="hv"><input id="ist" data-key="ist" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off" placeholder="Plan"><span class="unit">kcal</span></span>
      </label>
    </div>
  </section>

  <section class="sheet" aria-label="Eingaben und Ergebnis">
    <label class="row input" for="ruhe">
      <span class="label">Ruheenergie</span>
      <span class="value"><input id="ruhe" data-key="ruhe" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input trow" for="t1">
      <span class="tlab"><span class="tn">Training 1</span><span class="tsw"><select class="tsel" data-tkey="a1" aria-label="Trainingstyp für Training 1"></select></span></span>
      <span class="value"><input id="t1" data-key="t1" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input trow" for="t2">
      <span class="tlab"><span class="tn">Training 2</span><span class="tsw"><select class="tsel" data-tkey="a2" aria-label="Trainingstyp für Training 2"></select></span></span>
      <span class="value"><input id="t2" data-key="t2" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input trow" for="t3">
      <span class="tlab"><span class="tn">Training 3</span><span class="tsw"><select class="tsel" data-tkey="a3" aria-label="Trainingstyp für Training 3"></select></span></span>
      <span class="value"><input id="t3" data-key="t3" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input" for="alltag" id="alltag-row">
      <span class="label">Alltag</span>
      <span class="value"><input id="alltag" data-key="alltag" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>

    <div class="row calc derived" id="derived-row" hidden>
      <span class="label">Alltag errechnet<small id="derived-note">Ist minus Trainings</small></span>
      <span class="value"><span class="num" id="out-derived">0</span><span class="unit">kcal</span></span>
    </div>
    <div class="row calc">
      <span class="label">Aktivität <span class="mode" id="mode-badge">Plan</span></span>
      <span class="value"><span class="num" id="out-aktivitaet">0</span><span class="unit">kcal</span></span>
    </div>
    <div class="row calc">
      <span class="label">Zwischenstand</span>
      <span class="value"><span class="num" id="out-zwischen">0</span><span class="unit">kcal</span></span>
    </div>

    <label class="row input" for="surplus">
      <span class="label">Surplus</span>
      <span class="value"><input id="surplus" data-key="surplus" type="number" enterkeyhint="done" step="50" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <div class="chips" role="group" aria-label="Surplus Schnellwahl">
      <button type="button" data-surplus="0">0</button>
      <button type="button" data-surplus="150">+150</button>
      <button type="button" data-step="-50">−50</button>
      <button type="button" data-step="50">+50</button>
    </div>

  </section>

  <div class="tiles" aria-live="polite">
    <div class="tile total"><span class="tl">Gesamt</span><span class="tv"><span class="num" id="out-gesamt">0</span><span class="unit">kcal</span></span></div>
    <div class="tile rest" id="rest-box"><span class="tl" id="rest-label">Noch zu essen</span><span class="tv"><span class="num" id="out-rest">0</span><span class="unit">kcal</span></span></div>
  </div>

  <div class="actions">
    <button type="button" class="copy" id="copy">Kopieren</button>
    <button type="button" id="paste" disabled>Einfügen</button>
    <button type="button" class="reset" id="reset">Reset</button>
  </div>
  <div class="resetnote" id="reset-note" hidden></div>
</main>

<nav class="slots" aria-label="Wochentag wählen">
  <div class="inner">
    <button type="button" data-slot="0" aria-pressed="false">Mo</button>
    <button type="button" data-slot="1" aria-pressed="false">Di</button>
    <button type="button" data-slot="2" aria-pressed="false">Mi</button>
    <button type="button" data-slot="3" aria-pressed="false">Do</button>
    <button type="button" data-slot="4" aria-pressed="false">Fr</button>
    <button type="button" data-slot="5" aria-pressed="false">Sa</button>
    <button type="button" data-slot="6" aria-pressed="false">So</button>
  </div>
</nav>

<script>
(function () {
  var STORE_KEY = "tagesplanung-v2";
  var OLD_KEY = "tagesbedarf-v1";
  /* Standard (auch nach Reset): Ruhe 2050. Training 1 und Alltag je Wochentag: Werte, die seit 29.06.2026 an etwa 95 % der Tage
     nicht unterschritten wurden (Apple Watch, Auswertung 10.11.2026). Alltag = aktive Kalorien minus Workouts inkl. Spaziergang,
     Training 1 = Kraft Workout. Spaziergänge sind nicht eingerechnet und bleiben optional. Mo, Mi, Fr Studio; Di, Do Heimgym; Sa, So frei. */
  var DEFAULTS = { ruhe: 2050, t1: 0, t2: 0, t3: 0, alltag: 280, surplus: 150, essen: 0, ist: 0 };   /* ist = Aktivität gesamt, gemessen (Yazio Verbrannt); 0 = leer, es gilt der Plan */
  var DAY_T1 = [230, 160, 230, 160, 230, 0, 0];
  /* Trainingstypen und ihr Standardwert in kcal: Wert, der seit 29.06.2026 bei 95 % der Einheiten nicht unterschritten wurde (Apple Watch, Auswertung 11.11.2026):
     Gym (Studio) 232, Homegym 164; Spaziergänge in zwei Gruppen (Grenze 240 kcal, dazwischen gibt es kaum Werte): klein 90 (n 113, Median 184), groß 261 (n 43, Median 294).
     "Anderes" lässt den Wert stehen. */
  var TYPES = [["", "Kein Training", 0], ["gym", "Gym", 230], ["home", "Homegym", 160], ["klein", "Kleiner Spaziergang", 160], ["gross", "Großer Spaziergang", 260], ["oez", "OEZ Runde", 65], ["frei", "Anderes", null]];
  var TYPE_MAP = {}; TYPES.forEach(function (t) { TYPE_MAP[t[0]] = t; });
  var TKEYS = ["a1", "a2", "a3"];   /* Typ von Training 1 bis 3 */
  /* Training 1 vorausgewählt: Mo, Mi, Fr Gym, Di, Do Homegym, Sa und So kein Training; Training 2 und 3 sind optional */
  function defType(n, slot) { return n === 1 && slot >= 0 && slot <= 4 ? (slot % 2 === 0 ? "gym" : "home") : ""; }
  /* Daten aus der Zeit vor den Typen: Typ aus dem Wert ableiten */
  function inferType(n, kcal) {
    if (!kcal) return "";
    if (n === 1) return kcal === 230 ? "gym" : kcal === 160 ? "home" : "frei";
    return (kcal === 150 || kcal === 160) ? "klein" : (kcal === 190 || kcal === 260 || kcal === 280) ? "gross" : (kcal === 65 || kcal === 90) ? "oez" : "frei";
  }
  var DAY_ALLTAG = [420, 310, 420, 310, 420, 280, 280];
  function defOf(k, slot) {
    var s = slot >= 0 && slot <= 6 ? slot : 0;
    if (k === "surplus") return s >= 5 ? 0 : DEFAULTS.surplus;
    if (k === "t1") return DAY_T1[s];
    if (k === "a1" || k === "a2" || k === "a3") return defType(Number(k.charAt(1)), s);
    if (k === "alltag") return DAY_ALLTAG[s];
    return DEFAULTS[k];
  }
  var RESET_KEYS = ["t1", "t2", "t3", "a1", "a2", "a3", "alltag", "essen", "ist"];
  var KEYS = Object.keys(DEFAULTS);
  var SLOT_COUNT = 7;   /* 0 = Montag bis 6 = Sonntag */
  var DAY_SHORT = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];   /* kurz, damit die Kopfzeile bei keinem Wochentag umbricht */
  function todayIdx() { return (new Date().getDay() + 6) % 7; }
  function dayNum(ts) { var d = new Date(ts); return d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate(); }
  var nf = new Intl.NumberFormat("de-DE");
  var inputs = {};
  var noteEl = document.getElementById("reset-note");

  /* Stufe Standard: Mo bis Fr +150, Sa und So 0 (Lean Gain Phase 3); ändert sich die Stufe, hier und in den Stufen Buttons anpassen */
  function sanitize(obj, slot) {
    var out = {};
    KEYS.forEach(function (k) {
      var def = defOf(k, slot);
      out[k] = (obj && typeof obj[k] === "number" && isFinite(obj[k])) ? obj[k] : def;
    });
    TKEYS.forEach(function (k, i) {
      var v = obj && typeof obj[k] === "string" && TYPE_MAP.hasOwnProperty(obj[k]) ? obj[k] : null;
      out[k] = v !== null ? v : (obj ? inferType(i + 1, out["t" + (i + 1)]) : defOf(k, slot));
    });
    return out;
  }

  function tsOf(v) { v = Number(v); return (isFinite(v) && v > 0) ? v : 0; }
  /* meta je Slot für den Sync: base = Stand in Neon, den dieses Gerät zuletzt gesehen hat, dirty = lokal geändert und noch nicht gesendet,
     lt = Zeitpunkt der letzten lokalen Änderung, touched = Slot enthält echte Werte (ein frisches Gerät mit Standardwerten sendet nichts),
     rs = letzter Reset von Hand (geht mit nach Neon, damit beide Geräte ihn kennen), ra = letzter automatischer Reset (rechnet jedes Gerät gleich aus) */
  var data = { active: 0, slots: [], clip: null, meta: [] };
  function newMeta(m, touched) {
    return { base: (m && typeof m.base === "string") ? m.base : null, dirty: !!(m && m.dirty), lt: (m && isFinite(Number(m.lt))) ? Number(m.lt) : 0, rev: 0, touched: m ? !!m.touched : touched,
             rs: tsOf(m && m.rs), ra: tsOf(m && m.ra) };
  }
  for (var i = 0; i < SLOT_COUNT; i++) { data.slots.push(sanitize(null, i)); data.meta.push(newMeta(null, false)); }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        for (var i = 0; i < SLOT_COUNT; i++) { data.slots[i] = sanitize(s.slots && s.slots[i], i); data.meta[i] = newMeta(s.meta && s.meta[i], !!(s.slots && s.slots[i]));
          if (!data.meta[i].touched) data.slots[i] = sanitize(null, i);   /* nie bearbeitet: immer die aktuellen Standardwerte */ }
        data.clip = s.clip ? sanitize(s.clip) : null;
        return;
      }
      /* Übernahme der Werte aus Version 1 in Slot 1 */
      var old = localStorage.getItem(OLD_KEY);
      if (old) { data.slots[0] = sanitize(JSON.parse(old), 0); data.meta[0] = newMeta(null, true); }
    } catch (e) { /* ohne Speicher weiterarbeiten */ }
  }
  /* Wochentage: Jeder Slot gehört zum nächsten Auftreten seines Wochentags ab dem Tag der letzten Änderung (Plan am Sonntag für Montag
     gilt für den kommenden Montag). Der Plan eines Tages bleibt an diesem Tag und am Folgetag stehen; am übernächsten Tag um 00:00
     ist er abgelaufen: Training, Alltag und Essen springen auf die Standardwerte wie beim Reset (Ruhe und Stufe bleiben). Das passiert
     nur in der Anzeige und ändert nichts an Neon; jedes Gerät rechnet es aus dem Zeitstempel der letzten Änderung selbst aus. */
  var GRACE_DAYS = 2;
  function expiryOf(i) {
    var lt = data.meta[i].lt;
    if (!lt) return 0;
    var e = new Date(lt), add = (i - ((e.getDay() + 6) % 7) + 7) % 7;
    return new Date(e.getFullYear(), e.getMonth(), e.getDate() + add + GRACE_DAYS).getTime();
  }
  function isStale(i) { var x = expiryOf(i); return x > 0 && x <= Date.now(); }
  function expire() {
    var changedActive = false;
    for (var i = 0; i < SLOT_COUNT; i++) {
      if (!isStale(i)) continue;
      var sl = data.slots[i], did = false;
      RESET_KEYS.forEach(function (k) { var d0 = defOf(k, i); if (sl[k] !== d0) { sl[k] = d0; did = true; } });
      if (did) { data.meta[i].ra = expiryOf(i); if (i === data.active) changedActive = true; }
    }
    return changedActive;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* egal */ }
  }
  /* Werte des aktiven Slots wurden hier geändert: lokal sichern, danach im Hintergrund nach Neon senden */
  function changed(slot) {

    save();
    schedulePush();
  }

  function cur() { return data.slots[data.active]; }
  var loadDay = dayNum(Date.now());

  /* Plan: Training 1 bis 3 plus Alltag. Ist (gemessene Aktivität gesamt) enthält die Trainings schon und ersetzt beide; der Alltag ergibt sich dann als Ist minus Trainings. */
  function calc(s) {
    var tr = s.t1 + s.t2 + s.t3, ist = s.ist > 0;
    var aktivitaet = ist ? s.ist : tr + s.alltag;
    var zwischen = s.ruhe + aktivitaet;
    var gesamt = zwischen + s.surplus;
    var rest = gesamt - s.essen;
    return { aktivitaet: aktivitaet, zwischen: zwischen, gesamt: gesamt, rest: rest, ist: ist, alltagIst: s.ist - tr };
  }
  function fmt(n) { return nf.format(Math.round(n)); }
  function fmtSigned(n) {
    var r = Math.round(n);
    return (r < 0 ? "−" : "") + nf.format(Math.abs(r));
  }

  function when(ts) {
    var d = new Date(ts);
    return DAY_SHORT[(d.getDay() + 6) % 7] + " " + d.getDate() + "." + (d.getMonth() + 1) + "., " + clock(ts);
  }
  /* Hinweis unter den Tasten: letzter Reset dieses Wochentags (wann, von Hand oder automatisch) und wann der nächste automatische kommt */
  function renderNote() {
    var i = data.active, m = data.meta[i], sl = data.slots[i], lines = [];
    if (m.rs || m.ra) {
      var user = m.rs >= m.ra;
      lines.push("Zuletzt zurückgesetzt: " + (user ? "von Hand" : "automatisch") + ", " + when(user ? m.rs : m.ra));
    }
    var x = expiryOf(i);
    if (x > Date.now() && RESET_KEYS.some(function (k) { return sl[k] !== defOf(k, i); })) lines.push("Automatischer Reset: " + when(x));
    noteEl.textContent = "";
    lines.forEach(function (t) { var d = document.createElement("div"); d.textContent = t; noteEl.appendChild(d); });
    noteEl.hidden = lines.length === 0;
  }

  function update() {
    renderNote();
    TKEYS.forEach(function (k) { sels[k].classList.toggle("none", cur()[k] === ""); });
    var r = calc(cur());
    document.getElementById("out-aktivitaet").textContent = fmt(r.aktivitaet);
    document.getElementById("out-zwischen").textContent = fmt(r.zwischen);
    document.getElementById("out-gesamt").textContent = fmt(r.gesamt);
    document.getElementById("out-rest").textContent = fmtSigned(r.rest);
    var over = r.rest < 0;
    document.getElementById("rest-box").classList.toggle("over", over);
    document.getElementById("rest-label").textContent = over ? "Über dem Ziel" : "Noch zu essen";
    /* Plan oder Ist: leer = Plan, gefüllt = Ist; man sieht es an der Karte, am Kennzeichen bei Aktivität und am abgedunkelten Alltag */
    document.getElementById("ist-card").classList.toggle("on", r.ist);
    document.getElementById("alltag-row").classList.toggle("off", r.ist);
    var mb = document.getElementById("mode-badge"); mb.textContent = r.ist ? "Ist" : "Plan"; mb.classList.toggle("ist", r.ist);
    var dr = document.getElementById("derived-row"); dr.hidden = !r.ist;
    document.getElementById("out-derived").textContent = fmtSigned(r.alltagIst);

  }
  var sels = {};
  document.querySelectorAll("select[data-tkey]").forEach(function (el) {
    sels[el.dataset.tkey] = el;
    TYPES.forEach(function (t) { var o = document.createElement("option"); o.value = t[0]; o.textContent = t[1]; el.appendChild(o); });
    el.addEventListener("change", function () {
      var k = el.dataset.tkey, n = k.charAt(1), t = TYPE_MAP[el.value];
      cur()[k] = el.value;
      if (t && t[2] !== null) { cur()["t" + n] = t[2]; inputs["t" + n].value = t[2]; }   /* Typ setzt den Standardwert, "Anderes" lässt ihn stehen */
      changed(); update();
    });
  });
  function writeInputs() {
    var s = cur();
    TKEYS.forEach(function (k) { sels[k].value = s[k]; });
    KEYS.forEach(function (k) { inputs[k].value = (k === "ist" && !s[k]) ? "" : s[k]; });
  }
  function renderSlots() {
    document.querySelectorAll("button[data-slot]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.slot) === data.active));
      b.classList.toggle("today", Number(b.dataset.slot) === todayIdx());
    });
    document.getElementById("slot-pill").textContent = DAY_SHORT[data.active];
    document.getElementById("paste").disabled = !data.clip;
  }

  document.querySelectorAll("input[data-key]").forEach(function (el) {
    inputs[el.dataset.key] = el;
    el.addEventListener("input", function () {
      var v = parseFloat(String(el.value).replace(",", "."));
      cur()[el.dataset.key] = isFinite(v) ? v : 0;
      changed();
      update();
    });
    el.addEventListener("focus", function () { try { el.select(); } catch (e) {} });
    el.addEventListener("keydown", function (ev) { if (ev.key === "Enter") el.blur(); });
    /* Wurde der Slot während der Eingabe aus Neon aktualisiert, werden die Felder erst nach dem Tippen neu geschrieben */
    el.addEventListener("blur", function () { if (deferApply) { deferApply = false; writeInputs(); update(); } });
  });

  document.querySelectorAll("button[data-surplus]").forEach(function (b) {
    b.addEventListener("click", function () {
      cur().surplus = Number(b.dataset.surplus);
      inputs.surplus.value = cur().surplus;
      changed(); update();
    });
  });
  document.querySelectorAll("button[data-step]").forEach(function (b) {
    b.addEventListener("click", function () {
      cur().surplus = cur().surplus + Number(b.dataset.step);
      inputs.surplus.value = cur().surplus;
      changed(); update();
    });
  });

  /* Slots umschalten */
  document.querySelectorAll("button[data-slot]").forEach(function (b) {
    b.addEventListener("click", function () {
      var n = Number(b.dataset.slot);
      if (n === data.active) return;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      disarm();
      data.active = n;
      expire();
      save(); writeInputs(); renderSlots(); update();
    });
  });

  function flash(btn, text, back) {
    btn.textContent = text;
    setTimeout(function () { btn.textContent = back; }, 1400);
  }

  /* Kopieren und Einfügen über einen App internen Speicher */
  var copyBtn = document.getElementById("copy");
  var pasteBtn = document.getElementById("paste");
  copyBtn.addEventListener("click", function () {
    data.clip = sanitize(cur(), data.active);
    save(); renderSlots();
    flash(copyBtn, "Kopiert", "Kopieren");
  });
  pasteBtn.addEventListener("click", function () {
    if (!data.clip) return;
    data.slots[data.active] = sanitize(data.clip, data.active);
    changed(); writeInputs(); update();
    flash(pasteBtn, "Eingefügt", "Einfügen");
  });

  /* Reset des aktuellen Slots: zwei Taps, damit er nicht versehentlich auslöst */
  var resetBtn = document.getElementById("reset");
  var armed = false, armTimer = null;
  function disarm() {
    armed = false; clearTimeout(armTimer);
    resetBtn.textContent = "Reset";
    resetBtn.classList.remove("armed");
  }
  resetBtn.addEventListener("click", function () {
    if (!armed) {
      armed = true;
      resetBtn.textContent = "Sicher?";
      resetBtn.classList.add("armed");
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    RESET_KEYS.forEach(function (k) { cur()[k] = defOf(k, data.active); });
    data.meta[data.active].rs = Date.now();
    changed(); writeInputs(); update();
  });

  /* ---------- Sync mit Neon ----------
     Lokal zuerst: die App rechnet immer mit den Werten auf dem Gerät. Neon läuft im Hintergrund mit.
     Die Rolle plan_sync sieht nur die Tabelle tagesplanung_sync (7 Zeilen, je Wochentag). Das Passwort steht nicht im Code,
     es liegt nur im Speicher dieses Geräts. Konflikte: pro Wochentag gewinnt der zuletzt geänderte Stand. */
  var SYNC = { host: "ep-icy-bird-b1nu0xgj.c-5.eu-central-1.aws.neon.tech", db: "neondb", user: "plan_sync" };
  var KEY_PW = "tagesplanung-sync-v1";
  var Q_PULL = "select slot::int as slot, data::text as data, floor(extract(epoch from updated_at)*1000)::bigint::text as v from public.tagesplanung_sync order by slot";
  var net = { state: "off", at: 0 };
  var busy = false, again = false, pushTimer = null, retryTimer = null, deferApply = false, lastOk = 0;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* egal */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* egal */ } }
  function clock(ts) { var d = new Date(ts); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function pending() { return data.meta.some(function (m) { return m.dirty; }); }

  var dotEl = document.getElementById("sync-dot"), textEl = document.getElementById("sync-text");
  var panel = document.getElementById("sync-panel"), setupEl = document.getElementById("sync-setup"), actionsEl = document.getElementById("sync-actions");
  var TEXT = {
    off: "Sync aus. Passwort eintragen, dann sind PC und iPhone immer auf demselben Stand.",
    wait: "Gleicht ab …",
    offline: "Keine Verbindung zu Neon. Änderungen bleiben auf dem Gerät und werden später gesendet.",
    denied: "Das Passwort wurde abgelehnt. Bitte noch einmal eintragen."
  };
  function setNet(state) {
    net.state = state;
    dotEl.className = "dot s-" + state;
    var hasPw = !!lsGet(KEY_PW);
    textEl.textContent = state === "ok" ? "Synchron · " + clock(net.at) : TEXT[state];
    setupEl.hidden = hasPw && state !== "denied";
    actionsEl.hidden = !hasPw;
  }

  function post(query) {
    var h = { "Neon-Connection-String": "postgresql://" + SYNC.user + ":" + encodeURIComponent(lsGet(KEY_PW) || "") + "@" + SYNC.host + "/" + SYNC.db + "?sslmode=require", "Neon-Raw-Text-Output": "true" };
    /* kein Content-Type Header: Safaris Vorab-Prüfung lässt ihn bei Neon nicht durch (wie in der Bilanz) */
    var opt = { method: "POST", headers: h, body: JSON.stringify({ query: query, params: [] }) }, timer = null;
    if (typeof AbortController !== "undefined") { var ac = new AbortController(); opt.signal = ac.signal; timer = setTimeout(function () { ac.abort(); }, 15000); }
    return fetch("https://" + SYNC.host + "/sql", opt).then(function (r) { if (timer) clearTimeout(timer); return r; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  /* Die Datenbank schläft nach einigen Minuten und braucht beim Aufwecken ein paar Sekunden: ein zweiter Versuch nach kurzer Pause */
  function run(query) {
    return post(query).catch(function () {
      return new Promise(function (res) { setTimeout(res, 2500); }).then(function () { return post(query); });
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { var e = new Error(t.slice(0, 200)); e.status = r.status; throw e; });
      return r.json().then(function (j) {
        var rows = j.rows || [], f = j.fields || [];
        return rows.map(function (row) {
          if (!Array.isArray(row)) return row;
          var o = {}; f.forEach(function (c, i) { o[c.name] = row[i]; }); return o;
        });
      });
    });
  }
  function qPush(slot) {
    var o = sanitize(data.slots[slot], slot);
    if (data.meta[slot].rs) o.rs = data.meta[slot].rs;   /* Zeitpunkt des letzten Resets von Hand */
    var js = JSON.stringify(o).replace(/'/g, "''");
    return "insert into public.tagesplanung_sync (slot, data, updated_at) values (" + (slot | 0) + ", '" + js + "'::jsonb, now()) on conflict (slot) do update set data = excluded.data, updated_at = now() returning floor(extract(epoch from updated_at)*1000)::bigint::text as v";
  }
  function parseVals(d, slot) {
    try { var o = typeof d === "string" ? JSON.parse(d) : d; if (o && typeof o === "object" && KEYS.some(function (k) { return typeof o[k] === "number" && isFinite(o[k]); })) return sanitize(o, slot); } catch (e) { /* ungültige Zeile zählt als leer */ }
    return null;
  }

  function parseRs(d) {
    try { var o = typeof d === "string" ? JSON.parse(d) : d; return o && typeof o === "object" ? tsOf(o.rs) : 0; } catch (e) { return 0; }
  }

  function schedulePush() {
    if (!lsGet(KEY_PW)) return;
    clearTimeout(pushTimer);
    setNet("wait");
    pushTimer = setTimeout(sync, 700);
  }

  function sync() {
    clearTimeout(pushTimer); clearTimeout(retryTimer);
    if (!lsGet(KEY_PW)) { setNet("off"); return Promise.resolve(); }
    if (busy) { again = true; return Promise.resolve(); }
    busy = true; setNet("wait");
    return run(Q_PULL).then(function (rows) {
      var by = {}, pushes = [], adoptedActive = false;
      rows.forEach(function (r) { var n = Number(r.slot), vals = (n >= 0 && n < SLOT_COUNT) ? parseVals(r.data, n) : null; if (vals) by[n] = { v: String(r.v), vals: vals, rs: parseRs(r.data) }; });
      for (var s = 0; s < SLOT_COUNT; s++) {
        var m = data.meta[s], row = by[s];
        if (!row) { if (m.touched) pushes.push(s); continue; }   /* in Neon noch leer: nur senden, wenn hier echte Werte stehen */
        if (row.rs > m.rs) m.rs = row.rs;   /* Reset von Hand auf dem anderen Gerät: den späteren Zeitpunkt behalten */
        if (row.v === m.base) { if (m.dirty) pushes.push(s); continue; }
        if (m.dirty && m.lt > Number(row.v)) { pushes.push(s); continue; }   /* lokal neuer als Neon */
        data.slots[s] = row.vals; m.base = row.v; m.dirty = false; m.touched = true; m.lt = Number(row.v);   /* Neon ist neuer: übernehmen */
        if (s === data.active) adoptedActive = true;
      }
      if (expire()) adoptedActive = true;
      renderNote();
      if (adoptedActive || pushes.length === 0) save();
      if (adoptedActive) {
        if (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.key) deferApply = true;
        else { writeInputs(); }
        update();
      }
      return pushes.reduce(function (p, s) {
        return p.then(function () {
          var m = data.meta[s], rev = m.rev;
          return run(qPush(s)).then(function (res) {
            var v = res[0] && res[0].v != null ? String(res[0].v) : null;
            if (!v) throw new Error("keine Antwort von Neon");
            m.base = v; m.touched = true; if (m.rev === rev) m.dirty = false;
          });
        });
      }, Promise.resolve());
    }).then(function () {
      save(); busy = false; net.at = Date.now(); lastOk = net.at;
      if (again || pending()) { again = false; schedulePush(); } else setNet("ok");
    }).catch(function (e) {
      busy = false; again = false;
      var denied = e && (e.status === 400 || e.status === 401 || e.status === 403) && /password|authentication|role|auth/i.test(e.message || "");
      if (denied) { setNet("denied"); return; }
      setNet("offline");
      retryTimer = setTimeout(function () { if (!document.hidden && active()) sync(); }, 20000);
    });
  }

  document.getElementById("sync-toggle").addEventListener("click", function () {
    panel.hidden = !panel.hidden;
    this.setAttribute("aria-expanded", String(!panel.hidden));
    if (!panel.hidden && !lsGet(KEY_PW)) { try { document.getElementById("sync-pw").focus(); } catch (e) {} }
  });
  document.getElementById("sync-save").addEventListener("click", function () {
    var v = document.getElementById("sync-pw").value.trim();
    if (!v) return;
    lsSet(KEY_PW, v); document.getElementById("sync-pw").value = ""; sync();
  });
  var outBtn = document.getElementById("sync-out"), outArmed = false, outTimer = null;
  outBtn.addEventListener("click", function () {
    if (!outArmed) {
      outArmed = true; outBtn.textContent = "Sicher?"; outBtn.classList.add("armed");
      outTimer = setTimeout(function () { outArmed = false; outBtn.textContent = "Zugang zurücksetzen"; outBtn.classList.remove("armed"); }, 3000);
      return;
    }
    clearTimeout(outTimer); outArmed = false; outBtn.textContent = "Zugang zurücksetzen"; outBtn.classList.remove("armed");
    lsDel(KEY_PW); clearTimeout(pushTimer); clearTimeout(retryTimer); setNet("off");
  });
  /* Abgleich beim Zurückkehren in die App, bei wiederkehrendem Netz und alle 15 Sekunden, solange die App sichtbar ist und
     in den letzten 10 Minuten angetippt wurde. Danach Pause: sonst hielte eine dauerhaft offene Seite die Datenbank wach und
     würde das Rechenzeit Limit des Free Plans aufbrauchen. Beim nächsten Antippen wird sofort abgeglichen. */
  var POLL_MS = 15000, IDLE_MS = 10 * 60 * 1000, lastAct = Date.now();
  function active() { return Date.now() - lastAct < IDLE_MS; }
  function soon() { if (lsGet(KEY_PW) && !busy && Date.now() - lastOk > 10000) sync(); }
  function touchAct() {
    var wasIdle = !active();
    lastAct = Date.now();
    if (wasIdle) soon();
  }
  ["pointerdown", "keydown", "touchstart"].forEach(function (n) { document.addEventListener(n, touchAct, { passive: true, capture: true }); });
  function newDay() {
    if (dayNum(Date.now()) === loadDay) return;
    loadDay = dayNum(Date.now());
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    data.active = todayIdx(); expire(); save(); writeInputs(); renderSlots(); update();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { newDay(); lastAct = Date.now(); soon(); } else if (pending()) sync(); });
  window.addEventListener("online", function () { if (lsGet(KEY_PW)) sync(); });
  window.addEventListener("pageshow", function () { newDay(); lastAct = Date.now(); soon(); });
  setInterval(function () { if (!document.hidden && active() && !busy && !pending() && lsGet(KEY_PW)) sync(); }, POLL_MS);

  load();
  data.active = todayIdx();
  expire();
  writeInputs();
  renderSlots();
  update();
  setNet(lsGet(KEY_PW) ? "wait" : "off");
  if (lsGet(KEY_PW)) sync();
})();
</script>
</body>
