<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagesplanung</title>
<meta name="description" content="Tagesplanung: Ruheenergie plus Aktivität plus Surplus, abzüglich geplantem Essen, in drei Slots.">
<meta name="theme-color" content="#f1f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e181e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tagesplanung">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>if (window.navigator.standalone) document.documentElement.classList.add("standalone");</script>
<style>
:root {
  /* Layout: eine Spalte, alle Zeilen kompakt, Slot Umschalter als feste Leiste unten */
  --bg: #f1f5fa;
  --surface: #ffffff;
  --ink: #1b2a33;
  --muted: #5d6f7b;
  --input-row: #eaf2ff;
  --input-ink: #1f4fd8;
  --calc-row: #e4f0ec;
  --total-bg: #17414a;
  --total-ink: #ffffff;
  --rest-bg: #e4f0ec;
  --rest-ink: #0d6b4f;
  --line: #d3dfe9;
  --focus: #1f4fd8;
  --danger: #b3261e;
  --danger-bg: #fdeceb;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --row-h: clamp(34px, 4.9dvh, 44px);
  --big-h: clamp(54px, 8dvh, 68px);
  --bar-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e181e;
    --surface: #15242c;
    --ink: #e6eef2;
    --muted: #93a6b2;
    --input-row: #172a3d;
    --input-ink: #86adff;
    --calc-row: #17302a;
    --total-bg: #1f5a66;
    --total-ink: #ffffff;
    --rest-bg: #17302a;
    --rest-ink: #6fe0b4;
    --line: #2a3d48;
    --focus: #86adff;
    --danger: #ff8a80;
    --danger-bg: #3a1c1a;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-variant-numeric: tabular-nums;
  padding:
    max(10px, calc(env(safe-area-inset-top) * 1.4))
    max(14px, env(safe-area-inset-right))
    calc(var(--bar-h) + env(safe-area-inset-bottom) + 14px)
    max(14px, env(safe-area-inset-left));
}
/* Home Bildschirm Modus: iOS meldet dort keinen oberen Sicherheitsabstand, der Titel läge im Unschärfebereich der Statusleiste */
@media (display-mode: standalone) {
  body { padding-top: max(48px, calc(env(safe-area-inset-top) * 1.4)); }
}
html.standalone body { padding-top: max(48px, calc(env(safe-area-inset-top) * 1.4)); }

main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; }
header h1 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.015em; }
.head-right { display: flex; align-items: center; gap: 10px; }
.ver { color: var(--muted); font-size: 0.72rem; }
.pill {
  background: var(--total-bg); color: var(--total-ink);
  font-size: 0.8rem; font-weight: 800; border-radius: 999px; padding: 4px 12px;
}

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--row-h); padding: 2px 16px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row.input { background: var(--input-row); }
.row.calc { background: var(--calc-row); font-weight: 700; }
.row .label { font-size: 1.02rem; }
.row .value { display: flex; align-items: baseline; gap: 6px; }
.unit { color: var(--muted); font-size: 0.75rem; font-weight: 600; }

.row input {
  width: 6.5ch; min-width: 0; height: 34px; text-align: right;
  font: 800 1.3rem/1 var(--font); font-variant-numeric: tabular-nums;
  color: var(--input-ink); background: transparent;
  border: 0; border-radius: 8px; padding: 0 2px;
  touch-action: manipulation;
  -moz-appearance: textfield; appearance: textfield;
}
.row input::-webkit-outer-spin-button,
.row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.row input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; background: color-mix(in srgb, var(--input-ink) 8%, transparent); }
.row.calc .num { font-size: 1.3rem; font-weight: 800; }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 6px 14px 8px; background: var(--input-row); border-bottom: 1px solid var(--line); }

button {
  font: 700 0.95rem var(--font); cursor: pointer; touch-action: manipulation;
  border-radius: 10px; border: 1.5px solid var(--input-ink); color: var(--input-ink);
  background: transparent; padding: 0 10px; min-height: 36px;
}
button:active { background: color-mix(in srgb, var(--input-ink) 16%, transparent); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }

.big {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--big-h); padding: 6px 16px;
}
.big .label { font-size: 1.35rem; font-weight: 800; }
.big .num { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.015em; }
.big .value { display: flex; align-items: baseline; gap: 8px; }
.total { background: var(--total-bg); color: var(--total-ink); }
.total .unit { color: color-mix(in srgb, var(--total-ink) 72%, transparent); }
.rest { background: var(--rest-bg); color: var(--rest-ink); border-top: 1px solid var(--line); }
.rest .unit { color: inherit; opacity: 0.8; }
.rest.over { background: var(--danger-bg); color: var(--danger); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions button { min-height: 44px; border-radius: 12px; }
.actions .copy { background: var(--total-bg); border-color: var(--total-bg); color: var(--total-ink); }
.actions .copy:active { background: color-mix(in srgb, var(--total-bg) 82%, black); }
.actions .reset { border-color: var(--line); color: var(--muted); background: var(--surface); }
.actions .reset.armed { border-color: var(--danger); color: var(--danger); }


.slots {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
.slots .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slots button {
  min-height: 44px; border-radius: 12px; font-size: 1rem;
  border-color: var(--line); color: var(--muted); background: transparent;
}
.slots button[aria-pressed="true"] { background: var(--total-bg); border-color: var(--total-bg); color: var(--total-ink); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tagesplanung</h1>
    <span class="head-right"><span class="ver">v1.2.1</span><span class="pill" id="slot-pill">Slot 1</span></span>
  </header>

  <section class="sheet" aria-label="Eingaben und Ergebnis">
    <label class="row input" for="ruhe">
      <span class="label">Ruheenergie</span>
      <span class="value"><input id="ruhe" data-key="ruhe" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input" for="t1">
      <span class="label">Training 1</span>
      <span class="value"><input id="t1" data-key="t1" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input" for="t2">
      <span class="label">Training 2</span>
      <span class="value"><input id="t2" data-key="t2" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input" for="t3">
      <span class="label">Training 3</span>
      <span class="value"><input id="t3" data-key="t3" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <label class="row input" for="alltag">
      <span class="label">Alltag</span>
      <span class="value"><input id="alltag" data-key="alltag" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>

    <div class="row calc">
      <span class="label">Aktivität</span>
      <span class="value"><span class="num" id="out-aktivitaet">0</span><span class="unit">kcal</span></span>
    </div>
    <div class="row calc">
      <span class="label">Zwischenstand</span>
      <span class="value"><span class="num" id="out-zwischen">0</span><span class="unit">kcal</span></span>
    </div>

    <label class="row input" for="surplus">
      <span class="label">Surplus</span>
      <span class="value"><input id="surplus" data-key="surplus" type="number" enterkeyhint="done" step="50" autocomplete="off"><span class="unit">kcal</span></span>
    </label>
    <div class="chips" role="group" aria-label="Surplus Schnellwahl">
      <button type="button" data-surplus="0">0</button>
      <button type="button" data-surplus="150">+150</button>
      <button type="button" data-step="-50">−50</button>
      <button type="button" data-step="50">+50</button>
    </div>

    <div class="big total" aria-live="polite">
      <span class="label">Gesamt</span>
      <span class="value"><span class="num" id="out-gesamt">0</span><span class="unit">kcal</span></span>
    </div>

    <label class="row input" for="essen">
      <span class="label">Essen eingeplant</span>
      <span class="value"><input id="essen" data-key="essen" type="number" inputmode="numeric" enterkeyhint="done" step="1" min="0" autocomplete="off"><span class="unit">kcal</span></span>
    </label>

    <div class="big rest" id="rest-box" aria-live="polite">
      <span class="label" id="rest-label">Noch zu essen</span>
      <span class="value"><span class="num" id="out-rest">0</span><span class="unit">kcal</span></span>
    </div>
  </section>

  <div class="actions">
    <button type="button" class="copy" id="copy">Kopieren</button>
    <button type="button" id="paste" disabled>Einfügen</button>
    <button type="button" class="reset" id="reset">Reset</button>
  </div>
</main>

<nav class="slots" aria-label="Slot wählen">
  <div class="inner">
    <button type="button" data-slot="0" aria-pressed="true">Slot 1</button>
    <button type="button" data-slot="1" aria-pressed="false">Slot 2</button>
    <button type="button" data-slot="2" aria-pressed="false">Slot 3</button>
  </div>
</nav>

<script>
(function () {
  var STORE_KEY = "tagesplanung-v2";
  var OLD_KEY = "tagesbedarf-v1";
  var DEFAULTS = { ruhe: 2050, t1: 0, t2: 0, t3: 0, alltag: 0, surplus: 150, essen: 0 };
  var RESET_KEYS = ["t1", "t2", "t3", "alltag", "essen"];
  var KEYS = Object.keys(DEFAULTS);
  var SLOT_COUNT = 3;
  var nf = new Intl.NumberFormat("de-DE");
  var inputs = {};

  function sanitize(obj) {
    var out = {};
    KEYS.forEach(function (k) {
      out[k] = (obj && typeof obj[k] === "number" && isFinite(obj[k])) ? obj[k] : DEFAULTS[k];
    });
    return out;
  }

  var data = { active: 0, slots: [], clip: null };
  for (var i = 0; i < SLOT_COUNT; i++) data.slots.push(sanitize(null));

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        for (var i = 0; i < SLOT_COUNT; i++) data.slots[i] = sanitize(s.slots && s.slots[i]);
        if (s.active === 0 || s.active === 1 || s.active === 2) data.active = s.active;
        data.clip = s.clip ? sanitize(s.clip) : null;
        return;
      }
      /* Übernahme der Werte aus Version 1 in Slot 1 */
      var old = localStorage.getItem(OLD_KEY);
      if (old) data.slots[0] = sanitize(JSON.parse(old));
    } catch (e) { /* ohne Speicher weiterarbeiten */ }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* egal */ }
  }

  function cur() { return data.slots[data.active]; }

  function calc(s) {
    var aktivitaet = s.t1 + s.t2 + s.t3 + s.alltag;
    var zwischen = s.ruhe + aktivitaet;
    var gesamt = zwischen + s.surplus;
    var rest = gesamt - s.essen;
    return { aktivitaet: aktivitaet, zwischen: zwischen, gesamt: gesamt, rest: rest };
  }
  function fmt(n) { return nf.format(Math.round(n)); }
  function fmtSigned(n) {
    var r = Math.round(n);
    return (r < 0 ? "−" : "") + nf.format(Math.abs(r));
  }

  function update() {
    var r = calc(cur());
    document.getElementById("out-aktivitaet").textContent = fmt(r.aktivitaet);
    document.getElementById("out-zwischen").textContent = fmt(r.zwischen);
    document.getElementById("out-gesamt").textContent = fmt(r.gesamt);
    document.getElementById("out-rest").textContent = fmtSigned(r.rest);
    var over = r.rest < 0;
    document.getElementById("rest-box").classList.toggle("over", over);
    document.getElementById("rest-label").textContent = over ? "Über dem Ziel" : "Noch zu essen";
  }
  function writeInputs() {
    var s = cur();
    KEYS.forEach(function (k) { inputs[k].value = s[k]; });
  }
  function renderSlots() {
    document.querySelectorAll("button[data-slot]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.slot) === data.active));
    });
    document.getElementById("slot-pill").textContent = "Slot " + (data.active + 1);
    document.getElementById("paste").disabled = !data.clip;
  }

  document.querySelectorAll("input[data-key]").forEach(function (el) {
    inputs[el.dataset.key] = el;
    el.addEventListener("input", function () {
      var v = parseFloat(String(el.value).replace(",", "."));
      cur()[el.dataset.key] = isFinite(v) ? v : 0;
      save();
      update();
    });
    el.addEventListener("focus", function () { try { el.select(); } catch (e) {} });
    el.addEventListener("keydown", function (ev) { if (ev.key === "Enter") el.blur(); });
  });

  document.querySelectorAll("button[data-surplus]").forEach(function (b) {
    b.addEventListener("click", function () {
      cur().surplus = Number(b.dataset.surplus);
      inputs.surplus.value = cur().surplus;
      save(); update();
    });
  });
  document.querySelectorAll("button[data-step]").forEach(function (b) {
    b.addEventListener("click", function () {
      cur().surplus = cur().surplus + Number(b.dataset.step);
      inputs.surplus.value = cur().surplus;
      save(); update();
    });
  });

  /* Slots umschalten */
  document.querySelectorAll("button[data-slot]").forEach(function (b) {
    b.addEventListener("click", function () {
      var n = Number(b.dataset.slot);
      if (n === data.active) return;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      disarm();
      data.active = n;
      save(); writeInputs(); renderSlots(); update();
    });
  });

  function flash(btn, text, back) {
    btn.textContent = text;
    setTimeout(function () { btn.textContent = back; }, 1400);
  }

  /* Kopieren und Einfügen über einen App internen Speicher */
  var copyBtn = document.getElementById("copy");
  var pasteBtn = document.getElementById("paste");
  copyBtn.addEventListener("click", function () {
    data.clip = sanitize(cur());
    save(); renderSlots();
    flash(copyBtn, "Kopiert", "Kopieren");
  });
  pasteBtn.addEventListener("click", function () {
    if (!data.clip) return;
    data.slots[data.active] = sanitize(data.clip);
    save(); writeInputs(); update();
    flash(pasteBtn, "Eingefügt", "Einfügen");
  });

  /* Reset des aktuellen Slots: zwei Taps, damit er nicht versehentlich auslöst */
  var resetBtn = document.getElementById("reset");
  var armed = false, armTimer = null;
  function disarm() {
    armed = false; clearTimeout(armTimer);
    resetBtn.textContent = "Reset";
    resetBtn.classList.remove("armed");
  }
  resetBtn.addEventListener("click", function () {
    if (!armed) {
      armed = true;
      resetBtn.textContent = "Sicher?";
      resetBtn.classList.add("armed");
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    RESET_KEYS.forEach(function (k) { cur()[k] = DEFAULTS[k]; });
    save(); writeInputs(); update();
  });

  load();
  writeInputs();
  renderSlots();
  update();
})();
</script>
</body>
</html>
